services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-runtime
    container_name: c28studios-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_NAME: "C28 — Software & Cloud Engineering"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://c28studios.com}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-c28studios}
      DB_USERNAME: ${DB_USERNAME:-c28user}
      DB_PASSWORD: ${DB_PASSWORD:-secret_change_me}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - c28-network

  mysql:
    image: mysql:8.0
    container_name: c28studios-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-c28studios}
      MYSQL_USER: ${DB_USERNAME:-c28user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_change_me}
    volumes:
      - c28-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - c28-network

  redis:
    image: redis:7-alpine
    container_name: c28studios-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - c28-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - c28-network

volumes:
  c28-mysql-data:
  c28-redis-data:

networks:
  c28-network:
    driver: bridge

