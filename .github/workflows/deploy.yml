name: C28 Production CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-and-tests:
    name: "1. Quality Gate & PHPUnit Suite"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Compile Production Frontend Assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Prepare Testing Environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan config:clear

      - name: Execute Automated PHPUnit Test Suite
        run: php artisan test --ansi

  devsecops-container-scan:
    name: "2. Docker Build & Trivy DevSecOps Scan"
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Multi-Stage Production Docker Image
        run: docker build --target production-runtime -t c28studios:${{ github.sha }} .

      - name: Run Aqua Trivy Vulnerability & Secret Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "c28studios:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          scanners: "vuln,secret"
          severity: "CRITICAL,HIGH"

  production-deploy-gate:
    name: "3. Production Release Gate"
    runs-on: ubuntu-latest
    needs:
      - quality-and-tests
      - devsecops-container-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Verify Pipeline Readiness for Production Rollout
        run: |
          echo "All PHPUnit tests and Trivy DevSecOps scans passed for commit ${{ github.sha }}."
          echo "Ready for zero-downtime container deployment."

